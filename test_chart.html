<!DOCTYPE html>
<html>
<head>
    <title>Chart Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.3/Chart.min.js"></script>
    <style>
        .container {
            width: 80%;
            margin: 20px auto;
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin: 20px 0;
        }
        select {
            padding: 8px;
            margin: 10px 0;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Dashboard Graph Test</h2>

        <select id="select_kilang">
            <option value="3" selected>Kilang Papan</option>
            <option value="4">Kilang Papan Lapis/Venir</option>
            <option value="5">Kilang Kayu Kumai</option>
        </select>

        <div class="chart-container">
            <canvas id="bar"></canvas>
        </div>
    </div>

    <script>
        let currentChart = null;

        // Sample data for testing
        const sampleData = {
            johor: 5,
            kedah: 3,
            kelantan: 7,
            melaka: 2,
            n9: 4,
            pahang: 6,
            perak: 8,
            perlis: 1,
            pinang: 9,
            selangor: 12,
            terengganu: 3,
            wp: 5
        };

        function ChartResponden(data) {
            var jsonData = data;
            console.log(jsonData);

            // Get the currently selected kilang type
            var selectedKilang = $('#select_kilang').val();
            var kilangTypes = {
                '3': 'Kilang Papan',
                '4': 'Kilang Papan Lapis/Venir',
                '5': 'Kilang Kayu Kumai'
            };

            // Destroy existing chart if it exists
            if (currentChart) {
                currentChart.destroy();
            }

            var bar = document.getElementById('bar');
            var ctx = bar.getContext('2d');

            // Clear the canvas
            ctx.clearRect(0, 0, bar.width, bar.height);

            currentChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Johor', 'Kedah', 'Kelantan',
                            'Melaka', 'Negeri Sembilan', 'Pahang',
                            'Perak', 'Perlis', 'Pulau Pinang', 'Selangor', 'Terengganu', 'Wilayah Persekutuan'],
                    datasets: [{
                        label: kilangTypes[selectedKilang] || 'Bilangan Responden',
                        data: [jsonData.johor, jsonData.kedah, jsonData.kelantan, jsonData.melaka, jsonData.n9, jsonData.pahang, jsonData.perak, jsonData.perlis, jsonData.pinang, jsonData.selangor, jsonData.terengganu, jsonData.wp],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.8)',
                            'rgba(54, 162, 235, 0.8)',
                            'rgba(255, 206, 86, 0.8)',
                            'rgba(75, 192, 192, 0.8)',
                            'rgba(153, 102, 255, 0.8)',
                            'rgba(255, 159, 64, 0.8)',
                            'rgba(75, 192, 192, 0.8)',
                            'rgba(153, 102, 255, 0.8)',
                            'rgba(255, 99, 132, 0.8)',
                            'rgba(54, 162, 235, 0.8)',
                            'rgba(255, 206, 86, 0.8)',
                            'rgba(75, 192, 192, 0.8)',
                        ],
                        borderColor: [
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)',
                            'rgba(255, 159, 64, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)',
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)',
                            'rgba(75, 192, 192, 1)',
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            fontSize: 14,
                            fontStyle: 'bold'
                        }
                    },
                    tooltips: {
                        enabled: true,
                        mode: 'index',
                        intersect: false,
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        titleFontColor: 'white',
                        bodyFontColor: 'white',
                        cornerRadius: 5,
                        displayColors: false,
                        callbacks: {
                            title: function(tooltipItems, data) {
                                return tooltipItems[0].label;
                            },
                            label: function(tooltipItem, data) {
                                var kilangType = kilangTypes[selectedKilang] || 'Bilangan Responden';
                                return kilangType + ': ' + tooltipItem.value;
                            }
                        }
                    },
                    scales: {
                        yAxes: [{
                            ticks: {
                                beginAtZero: true,
                                precision: 0,
                                fontSize: 12
                            },
                            gridLines: {
                                display: true,
                                color: 'rgba(0, 0, 0, 0.1)'
                            }
                        }],
                        xAxes: [{
                            ticks: {
                                fontSize: 11
                            },
                            gridLines: {
                                display: false
                            }
                        }]
                    },
                    animation: {
                        duration: 1000,
                        easing: 'easeInOutQuart'
                    },
                    hover: {
                        mode: 'nearest',
                        intersect: true,
                        onHover: function(event, elements) {
                            event.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
                        }
                    }
                },
                plugins: [{
                    afterDatasetsDraw: function(chart) {
                        var ctx = chart.ctx;
                        chart.data.datasets.forEach(function(dataset, i) {
                            var meta = chart.getDatasetMeta(i);
                            if (!meta.hidden) {
                                meta.data.forEach(function(element, index) {
                                    // Draw the text in black above the bar
                                    ctx.fillStyle = 'black';
                                    ctx.font = 'bold 12px Arial';
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'bottom';

                                    var position = element.tooltipPosition();
                                    var value = dataset.data[index];

                                    // Only show value if it's greater than 0
                                    if (value > 0) {
                                        ctx.fillText(value, position.x, position.y - 5);
                                    }
                                });
                            }
                        });
                    }
                }]
            });
        }

        // Initialize chart
        $(document).ready(function() {
            ChartResponden(sampleData);

            $('#select_kilang').change(function() {
                var shuttle = $(this).val();
                console.log('Selected:', shuttle);
                // Simulate different data for different shuttle types
                var newData = {...sampleData};
                if (shuttle == '4') {
                    newData.johor = 3;
                    newData.selangor = 8;
                    newData.perak = 5;
                } else if (shuttle == '5') {
                    newData.johor = 7;
                    newData.selangor = 15;
                    newData.kelantan = 4;
                }
                ChartResponden(newData);
            });
        });
    </script>
</body>
</html>
